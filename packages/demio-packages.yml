description: >-
  Demio ships exactly one first-party client library for the Public Demio API: a PHP SDK
  published to Packagist as meetdemio/demio-php-sdk from Demio's own GitHub organization
  (github.com/meetdemio). It is real and it is official — and it has had exactly one
  release, version 1.0 on 2016-03-22, with the repository last pushed on 2016-03-31. The
  API it wraps has itself been static since the published API Blueprint's 2022-04-19 last
  update, so the SDK is not behind a moving contract, but a decade without a release on
  the only client library a provider ships is the single strongest abandonment signal
  available here. The remaining first-party packages are internal front-end tooling
  (a shared UI component library and a lint-rules config) published to npm by Demio and
  Banzai engineers; they are catalogued for completeness and are explicitly NOT API
  clients.
