gaps:
  - >-
    No official client library in JavaScript/TypeScript, Python, Ruby, Go, Java, C# or
    Rust for the Public Demio API. PHP is the only language served, by a 2016 SDK.
  - >-
    The PHP SDK is not linked from the Demio Help Center or from the published API
    Blueprint at publicdemioapi.docs.apiary.io — a developer following Demio's own
    documentation would never learn it exists. It is discoverable only via Packagist or
    the meetdemio GitHub org.
