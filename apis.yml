aid: demio
name: Demio
description: >-
  Demio is a browser-based webinar and virtual-event platform built for B2B marketing and
  sales teams, operated by Banzai International, Inc. (NASDAQ: BNZI). It runs live,
  automated/evergreen, on-demand and series webinars with no attendee download, and pairs
  them with customizable registration pages, embeddable registration forms, in-session
  engagement tools (polls, handouts, featured actions, chat), recordings, Showcase event
  listings and post-webinar analytics. Its public developer surface is the Public Demio
  API — a key/secret authorized REST API at https://my.demio.com/api/v1 covering Events,
  Event Sessions (Dates), attendee registration with unique join links, and per-Session
  participation reporting. Demio documents the API as an Apiary API Blueprint, publishes
  burst rate limits and daily call quotas, runs a public Atlassian Statuspage, ships one
  first-party PHP SDK from its meetdemio GitHub organization, and offers a Zapier app with
  registration, join, no-show and event-update triggers for teams that do not want to call
  the API directly.
