relationship_to_api:
  note: >-
    The embed and the API do the same job by different routes: the embed posts a
    registration from the browser, PUT /event/register does it server-side and returns the
    unique join link. Teams that need the join link in their own CRM use the API or the
    Zapier app; the embed does not expose the link to the host page.
  api_equivalent: openapi/demio-openapi.yml#registerForEvent
